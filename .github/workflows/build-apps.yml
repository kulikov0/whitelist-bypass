name: Build Mobile Apps (Android & iOS)

on:
  push:
    branches: [ "main", "master" ]
  workflow_dispatch:

jobs:
  build:
    runs-on: macos-latest

    steps:
    - name: Checkout Code
      uses: actions/checkout@v4

    - name: Setup Go
      uses: actions/setup-go@v5
      with:
        go-version: '1.26.1'
        cache-dependency-path: relay/go.sum

    - name: Setup Java
      uses: actions/setup-java@v4
      with:
        distribution: 'temurin'
        java-version: '17'

    - name: Install NDK
      run: |
        echo "y" | $ANDROID_HOME/cmdline-tools/latest/bin/sdkmanager --install "ndk;29.0.14206865"
        
    - name: Install gomobile & Xcode CLI tools
      run: |
        go install golang.org/x/mobile/cmd/gomobile@latest
        go install golang.org/x/mobile/cmd/gobind@latest
        gomobile init

    - name: Build Android (APK)
      run: |
        export ANDROID_NDK_HOME=$ANDROID_HOME/ndk/29.0.14206865
        chmod +x ./build-go.sh
        chmod +x ./build-app.sh
        ./build-go.sh
        ./build-app.sh

    - name: Build iOS (IPA)
      run: |
        chmod +x ./build-ios.sh
        ./build-ios.sh

    - name: Upload Artifacts
      uses: actions/upload-artifact@v4
      with:
        name: mobile-apps
        path: |
          prebuilts/whitelist-bypass.apk
          prebuilts/whitelist-bypass-proxy.ipa
